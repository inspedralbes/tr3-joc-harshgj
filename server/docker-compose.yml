version: '3.9'

services:
  auth-server:
    build: .
    container_name: auth-server
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - SESSION_SECRET=change-this-to-a-long-random-string
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/me"]
      interval: 30s
      timeout: 5s
      retries: 3
